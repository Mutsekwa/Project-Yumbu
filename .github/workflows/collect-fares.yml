# Runs the fare collector every Monday morning and commits the new fares.
#
# One-time setup on github.com:
#   1. Repository -> Settings -> Secrets and variables -> Actions -> New repository secret
#      Name: SERPAPI_KEY    Value: your key from serpapi.com
#      More keys (optional): SERPAPI_KEY_2, SERPAPI_KEY_3. Unused names are simply skipped.
#   2. Repository -> Settings -> Actions -> General -> Workflow permissions
#      -> "Read and write permissions" -> Save
# You can also start it by hand: Actions tab -> Collect fares -> Run workflow.

name: Collect fares

on:
  schedule:
    - cron: "17 5 * * 1"     # every Monday 05:17 UTC (06:17 in Germany in winter)
  workflow_dispatch:          # adds a "Run workflow" button
    inputs:
      monthly:
        description: "Also run the monthly return-ticket and Kenyan point-of-sale checks"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r python/requirements.txt

      - name: Update income data
        run: python python/fetch_income_data.py
        continue-on-error: true

      - name: Collect fares
        run: python python/fare_collector.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPAPI_KEY_2: ${{ secrets.SERPAPI_KEY_2 }}
          SERPAPI_KEY_3: ${{ secrets.SERPAPI_KEY_3 }}

      # First Monday of each month only: two robustness checks (about 44 searches).
      # 1. Return tickets, to test whether "2 x one-way" is a fair estimate of a return fare.
      # 2. Kenyan and East African routes searched as if from Kenya, to test point-of-sale effects.
      - name: Monthly robustness checks
        run: |
          SCHEDULED_FIRST_WEEK=false
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%d)" -le 7 ]; then SCHEDULED_FIRST_WEEK=true; fi
          if [ "$SCHEDULED_FIRST_WEEK" = "true" ] || [ "${{ inputs.monthly }}" = "true" ]; then
            python python/fare_collector.py --trip return --days 30 --max-searches 40
            python python/fare_collector.py --gl ke --days 14 --max-searches 15 \
              --routes NBO-MBA,NBO-KIS,NBO-EDL,NBO-MYD,NBO-UKA,NBO-LAU,NBO-EBB,NBO-DAR,NBO-KGL,NBO-ZNZ,NBO-MGQ
          else
            echo "Not the first week of the month; skipping the monthly checks."
          fi
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPAPI_KEY_2: ${{ secrets.SERPAPI_KEY_2 }}
          SERPAPI_KEY_3: ${{ secrets.SERPAPI_KEY_3 }}

      - name: Commit new data
        run: |
          git config user.name "fare-collector-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "Fare snapshot $(date -u +%F)"
          git push
